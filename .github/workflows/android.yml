# DT-6: Android debug build + APK artifact. DT-25: every run also builds the release (unsigned, so R8 is checked
# on every PR), and a tag `android-v<major>.<minor>.<patch>` publishes a signed release APK on GitHub Releases,
# signed with the key from the repository's secrets (docs/install-android.md, "Making a release").
# Until DT-19 replaces the placeholder Gradle files, the build job is skipped (a skipped job counts as passing).
# After that, a missing or non-executable Gradle wrapper fails the check instead of being skipped.
name: android

on:
  pull_request:
  push:
    branches: [development]
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share one group per branch, so a new push cancels the superseded run.
  # Push and manual runs get one group per commit, so every commit on development gets its own run.
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: android setup check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Placeholder Gradle files (before DT-19) or a real, executable wrapper (after)?
        id: check
        run: |
          if grep -q "DT-19: replaced with" android/settings.gradle.kts; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gradle files are still the DT-1 placeholders; the Android build starts once DT-19 lands."
            exit 0
          fi
          if [ ! -f android/gradlew ]; then
            echo "::error::android/gradlew is missing. The Gradle wrapper must be committed (DT-19)."
            exit 1
          fi
          if [ ! -x android/gradlew ]; then
            echo "::error::android/gradlew is not executable in git. Run: git update-index --chmod=+x android/gradlew"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  build:
    name: android
    needs: detect
    if: needs.detect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Third-party action pinned to a commit (v6.3.0).
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Build debug APK and the (unsigned) release, run unit tests and lint
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: daytrace-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: android release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # to publish the GitHub Release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Third-party action pinned to a commit (v6.3.0). No build cache for a signed build.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-disabled: true
      - name: The version, from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not android-v<major>.<minor>.<patch> (for example android-v0.1.0)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The signing key, from the repository's secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.DAYTRACE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYTRACE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the DAYTRACE_KEYSTORE_BASE64 and DAYTRACE_KEYSTORE_PASSWORD secrets first (docs/install-android.md, Making a release)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build the signed release APK
        env:
          DAYTRACE_KEYSTORE: ${{ runner.temp }}/release.jks
          DAYTRACE_KEYSTORE_PASSWORD: ${{ secrets.DAYTRACE_KEYSTORE_PASSWORD }}
          DAYTRACE_KEY_ALIAS: daytrace
          DAYTRACE_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the signature, name the file and write the notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          certificate="$(grep -m1 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | awk '{print $NF}')"
          if [ -z "$certificate" ]; then echo "::error::The APK isn't signed."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/out"
          name="daytrace-android-$VERSION.apk"
          cp "$apk" "$RUNNER_TEMP/out/$name"
          (cd "$RUNNER_TEMP/out" && sha256sum "$name" > "$name.sha256")
          {
            echo "Daytrace for Android $VERSION, for sideloading (it isn't on the Play Store)."
            echo
            echo "**Install:** download \`$name\` on the phone and open it. The steps, including Samsung's, are in [docs/install-android.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install-android.md)."
            echo
            echo "**Check the file:** SHA-256 \`$(cut -d' ' -f1 "$RUNNER_TEMP/out/$name.sha256")\`."
            echo
            echo "**Signing certificate** (the same for every release, so each one installs over the one before): SHA-256 \`$certificate\`."
          } > "$RUNNER_TEMP/notes.md"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Daytrace for Android $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
