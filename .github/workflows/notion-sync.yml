# DT-5: move the Notion ticket named in a PR's title (or branch) when the PR opens, changes or merges.
# Needs the NOTION_TOKEN and NOTION_TICKETS_DB secrets (gh secret set); without them it notes that and passes.
name: notion-sync

on:
  pull_request:
    types: [opened, reopened, edited, closed]
    branches: [development]  # only PRs into development: merging a stacked PR into a feature branch isn't Done

permissions:
  contents: read

# No concurrency group: GitHub would cancel a queued run when a newer one queues, dropping that event. Runs may
# finish in any order, which is fine because a PR only ever moves its ticket forward (see the script).

jobs:
  sync:
    name: notion sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # The PR title is read from the event file by the script, never put into a shell command here.
      - name: Move the ticket
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TICKETS_DB: ${{ secrets.NOTION_TICKETS_DB }}
        run: python3 scripts/notion_sync.py
