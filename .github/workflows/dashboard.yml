# DT-6: dashboard type-check and production build.
# Runs on every PR (no path filter) so the required "dashboard" check always reports.
name: dashboard

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share one group per branch, so a new push cancels the superseded run.
  # Push and manual runs get one group per commit, so every commit on development gets its own run.
  group: dashboard-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
