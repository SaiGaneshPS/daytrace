# DT-6: dashboard type-check and production build. DT-52: Playwright end-to-end tests of the build (desktop and
# phone screens, accessibility with axe), with the hub's API mocked. DT-59: Vitest unit tests (every Insights chart
# draws the hub's fixture numbers exactly).
# Runs on every PR (no path filter) so the required "dashboard" check always reports.
name: dashboard

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs share one group per branch, so a new push cancels the superseded run.
  # Push and manual runs get one group per commit, so every commit on development gets its own run.
  group: dashboard-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright)
        run: npm run test:e2e
      - name: Keep the test results when they fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: dashboard/test-results/
          retention-days: 7
