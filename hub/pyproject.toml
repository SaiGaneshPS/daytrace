[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daytrace-hub"
version = "0.1.0"
description = "Daytrace hub: local-first, cross-device activity hub with a local AI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "zeroconf>=0.132",
    "qrcode[pil]>=7.4",
    "httpx>=0.27",
    "pandas>=2.2",
    "scipy>=1.13",
    "openai>=1.40",
    "psutil>=5.9",
    "pywin32>=306; sys_platform == 'win32'",
    "winotify>=1.1; sys_platform == 'win32'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
daytrace-hub = "daytrace_hub.__main__:main"

[tool.setuptools.packages.find]
include = ["daytrace_hub*"]

[tool.setuptools.package-data]
daytrace_hub = ["migrations/*.sql", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
